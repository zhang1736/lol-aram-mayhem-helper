[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-aram-mayhem-helper"
version = "1.0.3"
description = "Windows overlay that shows OP.GG augment 强度/欢迎度 for LOL ARAM: Mayhem"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
overlay = ["PySide6>=6.6"]
ocr = ["rapidocr_onnxruntime<=1.4.4", "opencv-python-headless", "mss", "numpy"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
